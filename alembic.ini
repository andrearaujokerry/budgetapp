# Developer convenience for running Alembic by hand, e.g.
#   BUDGETAPP_ENV=sandbox .venv/bin/alembic current
# The app itself never reads this file: budgetapp.db.run_migrations() builds the Alembic config in
# code. No database URL lives here; migrations/env.py builds it from budgetapp.config for
# $BUDGETAPP_ENV (default sandbox), with the role's password read from Keychain.

[alembic]
script_location = budgetapp:migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
